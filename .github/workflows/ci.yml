name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · eval · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (harness + api-guard)
        run: npm test

      - name: Eval — diagnostic flow accuracy (offline/deterministic)
        run: npm run eval:demo

      - name: Production build
        run: npm run build
        env:
          # The build must succeed WITHOUT a key (the app degrades to a clearly
          # labeled demo). Never put the real Jev key in CI.
          NODE_ENV: production
